# A new feature, from request to a reviewed, documented branch.
description = "Take a feature from request to a reviewed, documented branch"

[[step]]
agent = "analyst"
approve = true          # the user answers the open questions

[[step]]
agent = "planner"
approve = true          # the user approves the plan

[[step]]
agent = "implementer"

[[step]]
agent = "reviewer"
depends_on = ["implementer"]

[[step]]
agent = "security-auditor"
depends_on = ["implementer"]

[[step]]
id = "fix"
agent = "implementer"
task = "Fix every finding of the review and the high and critical ones of the security audit, folding each fix into the commit it belongs to while the branch is not pushed; leave the accepted risks as recorded, and return none when there is nothing to fix"
depends_on = ["reviewer", "security-auditor"]

[[step]]
agent = "documenter"
depends_on = ["fix"]
